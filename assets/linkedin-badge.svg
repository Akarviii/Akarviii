<svg xmlns="http://www.w3.org/2000/svg" width="360" height="52" viewBox="0 0 360 52" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a66c2" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#70b5f9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#004182" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Icon Container Gradient -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a66c2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#70b5f9" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="linkedInBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70b5f9"/>
      <stop offset="100%" stop-color="#0a66c2"/>
    </linearGradient>
  </defs>

  <!-- Main Button Container -->
  <rect x="1" y="1" width="358" height="50" rx="10" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Icon Section -->
  <g transform="translate(14, 9)">
    <!-- Icon Container Pill/Square -->
    <rect width="34" height="34" rx="8" fill="url(#iconBgGrad)" stroke="#0a66c2" stroke-width="1" stroke-opacity="0.5"/>
    
    <!-- LinkedIn 'in' Vector -->
    <g transform="translate(8, 8) scale(0.75)">
      <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" fill="url(#linkedInBlue)"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc" letter-spacing="0.3">
    LinkedIn
  </text>
  <text x="60" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#70b5f9" letter-spacing="0.2">
    Daniel
  </text>

  <!-- Action Arrow Indicator -->
  <g transform="translate(325, 19)" stroke="#70b5f9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="2" y1="12" x2="12" y2="2"/>
    <polyline points="4 2 12 2 12 10"/>
  </g>
</svg>
